[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-testops"
version = "0.1.0"
description = "MCP server for Allure TestOps"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_testops"]

[tool.pytest.ini_options]
# The package has modules like tools/cases.py; without this, pytest would hunt for
# tests inside src/ and collect imports such as TestOpsError as a test class.
testpaths = ["tests"]
