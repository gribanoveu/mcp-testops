name: publish-pypi

# Trusted publishing: no token, the runner proves its identity to PyPI over OIDC.
# Needs a one-time setup on PyPI: project mcp-testops → Publishing → add a trusted
# publisher for this repository with workflow "publish-pypi.yml" and environment "pypi".
# After that `uvx mcp-testops` works without installing anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --quiet build
      - run: python -m build --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    # The project does not exist on PyPI until the trusted publisher is configured there;
    # until then this job reports a failure without painting the release run red.
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
